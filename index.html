<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog ABP - Inglés</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>ABP Blog</h2>
            <nav>
                <ul>
                    <li><a href="#" onclick="showSection('home')">Home</a></li>
                    <li><a href="#" onclick="showSection('podcasts')">7tos - Podcasts</a></li>
                    <li><a href="#" onclick="showSection('videos')">8vos - Videos</a></li>
                </ul>
            </nav>
        </aside>
        
        <main class="content">

            <header class="site-header">
                <h1 id="section-title">Welcome to the School Hub</h1>
            </header>
            <section id="main-view">
                <p>Selecciona una sección del menú para visualizar los trabajos.</p>
                <!-- Aquí se cargarán dinámicamente los trabajos -->
            </section>
        </main>
        <dialog id="access-dialog">
            <form id="access-form">
                <h2>👋 Welcome!</h2>
                <p>Para comentar, ingresa tus datos:</p>
                
                <label>
                    Name
                    <input type="text" id="access-first-name" required>
                </label>

                <label>
                    Last Name
                    <input type="text" id="access-last-name" required>
                </label>

                <label>
                    Class
                    <input type="text" id="access-class" placeholder="Ex: 5°A" required>
                </label>

                <p id="access-error" style="color: red; display: none;"></p>

                <button type="submit">Enter</button>
            </form>

        </dialog>
        
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
